name: 上游更新检查与PR

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）自动检查上游更新
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: '上游分支名'
        required: false
        default: 'ludashi-plus/4.1'
      target_branch:
        description: '目标分支名'
        required: false
        default: 'ludashi-plus/4.1'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游仓库并获取
        id: fetch
        run: |
          git remote add upstream https://github.com/squalle0nhart/winlator_ludashi_plus.git || true
          git fetch upstream --tags

          UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch || 'ludashi-plus/4.1' }}"
          TARGET_BRANCH="${{ github.event.inputs.target_branch || 'ludashi-plus/4.1' }}"

          echo "目标分支: $TARGET_BRANCH"
          echo "上游分支: $UPSTREAM_BRANCH"

          git checkout "$TARGET_BRANCH"

          # 检查是否有新的上游提交
          BEHIND=$(git rev-list --count HEAD..upstream/$UPSTREAM_BRANCH 2>/dev/null || echo "0")
          echo "落后上游提交数: $BEHIND"
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT

          if [ "$BEHIND" = "0" ]; then
            echo "已经是最新，无需同步"
            echo "has_updates=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_updates=true" >> $GITHUB_OUTPUT

          # 生成上游新提交列表
          echo "=== 上游新提交 ===" > upstream_commits.txt
          git log --oneline HEAD..upstream/$UPSTREAM_BRANCH >> upstream_commits.txt
          cat upstream_commits.txt

          # 生成修改的文件列表
          echo "" >> upstream_commits.txt
          echo "=== 修改的文件 ===" >> upstream_commits.txt
          git diff --name-only HEAD..upstream/$UPSTREAM_BRANCH >> upstream_commits.txt
          cat upstream_commits.txt

          # 生成文件变更统计
          echo "" >> upstream_commits.txt
          echo "=== 变更统计 ===" >> upstream_commits.txt
          git diff --stat HEAD..upstream/$UPSTREAM_BRANCH >> upstream_commits.txt

          # 保存到输出
          echo "commit_list<<EOF" >> $GITHUB_OUTPUT
          git log --oneline HEAD..upstream/$UPSTREAM_BRANCH >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "file_list<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only HEAD..upstream/$UPSTREAM_BRANCH >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建同步分支并尝试合并
        if: steps.fetch.outputs.has_updates == 'true'
        id: merge
        run: |
          UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch || 'ludashi-plus/4.1' }}"
          TARGET_BRANCH="${{ github.event.inputs.target_branch || 'ludashi-plus/4.1' }}"
          PR_BRANCH="sync-upstream-$(date +%Y%m%d-%H%M%S)"

          echo "pr_branch=$PR_BRANCH" >> $GITHUB_OUTPUT

          git checkout -b "$PR_BRANCH"

          # 尝试合并，冲突时保留我们的版本（ours策略）
          if git merge upstream/$UPSTREAM_BRANCH --no-edit -X ours; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "合并成功（无冲突或冲突已自动保留我方版本）"
          else
            echo "merge_success=false" >> $GITHUB_OUTPUT
            echo "存在冲突，保留冲突标记供人工审查"
            git add -A
            git commit -m "自动合并上游（含冲突，需手动解决）" || true
          fi

          git push origin "$PR_BRANCH"

      - name: 创建PR
        if: steps.fetch.outputs.has_updates == 'true'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ steps.merge.outputs.pr_branch }}
          destination_branch: ${{ github.event.inputs.target_branch || 'ludashi-plus/4.1' }}
          pr_title: "上游同步：${{ steps.fetch.outputs.behind }}个新提交待审查"
          pr_body: |
            ## 上游更新通知

            此 PR 由 GitHub Actions 自动创建，**不会自动合并**，请人工审查后决定是否合并。

            ### 上游新提交（${{ steps.fetch.outputs.behind }}个）
            ```
            ${{ steps.fetch.outputs.commit_list }}
            ```

            ### 修改的文件
            ```
            ${{ steps.fetch.outputs.file_list }}
            ```

            ### 合并状态
            - 冲突策略：`-X ours`（冲突时保留我方版本）
            - 合并结果：${{ steps.merge.outputs.merge_success == 'true' && '无冲突' || '存在冲突，已保留冲突标记' }}

            ### 审查建议
            1. 检查上游提交是否包含重要修复或新功能
            2. 检查修改的文件是否与我们的独家修改冲突
            3. 如有冲突，手动解决后再合并
            4. 如不需要这些更新，直接关闭PR

            > 上游仓库：squalle0nhart/winlator_ludashi_plus
            > 上游分支：ludashi-plus/4.1
          pr_label: "upstream-sync,needs-review"
