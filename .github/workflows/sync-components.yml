name: 自动同步上游组件

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动检查
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      component:
        description: '指定同步的组件名（留空同步全部）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync-components:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests zstandard

      - name: 同步上游组件
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/sync_components.py

      - name: 提交变更
        if: steps.sync.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 自动同步上游组件最新版本（panDXVK等）" || echo "无变更可提交"
          git push || echo "推送失败或无变更"

      - name: 无更新通知
        if: steps.sync.outputs.has_updates != 'true'
        run: echo "所有组件已是最新，无需提交"
