name: Android CI Bionic

on:
  workflow_dispatch:
  push:
    branches:
      - 4.1
      - ludashi-plus/4.1
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL \
            "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" \
            -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so
          test -s app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Sign APK with apksigner
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "原始APK: $APK_PATH"
          # 找到apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | head -1)
          echo "apksigner: $APKSIGNER"
          # 手动签名（v1+v2+v3）
          $APKSIGNER sign \
            --ks app/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_PATH" \
            "$APK_PATH"
          echo "✅ APK签名完成"
          # 验证签名
          $APKSIGNER verify --print-certs "$APK_PATH"

      - name: Verify APK signature
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK_PATH"
          ls -lh "$APK_PATH"
          # 检查APK是否包含META-INF签名文件
          if unzip -l "$APK_PATH" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.DSA\|META-INF/.*\.EC"; then
            echo "✅ APK已签名"
            unzip -l "$APK_PATH" | grep "META-INF/"
          else
            echo "❌ APK未签名！"
            exit 1
          fi
          # 用keytool验证签名证书
          CERT=$(unzip -p "$APK_PATH" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep "Owner:" || true)
          echo "签名证书: $CERT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bionic-Build-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
